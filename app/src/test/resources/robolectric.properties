# Robolectric 4.16 ships framework jars up to SDK 36, so it cannot run against
# this module's targetSdk of 37. Pinned below it deliberately, the same way
# podsilo pins below its own target.
#
# What that costs: these tests do not prove behaviour on Android 17 - the phone
# does that, and app/src/androidTest/ is what runs there. What they do prove is
# that the screens compose, lay out and respond, which is API-agnostic and was
# previously not checked anywhere a runner could reach.
sdk=34
