org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Back off properly when a repository rate-limits. Gradle already retries 408,
# 429 and 5xx, but by default only 3 attempts, 1s apart then 2s - far too short
# for Maven Central's 429s. CI hit exactly that on the 157 MB Robolectric
# native-runtime jar, with two jobs downloading it at once. 5 attempts from 5s,
# doubling, wait up to 75s before giving up. A 404 is not retried, so a missing
# artifact still fails immediately. These are internal Gradle properties:
# re-check them after a major Gradle upgrade (see docs/build-environment.md).
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
