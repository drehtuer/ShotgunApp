name: Release

# Only on a release tag. Nothing here runs for ordinary pushes or PRs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release key is deliberately NOT held on GitHub, so this step only
      # fires if a maintainer has chosen to add one. Without it the build still
      # succeeds and produces unsigned artifacts to be signed locally.
      # The secrets context is not dependable inside a step `if`, so the value
      # is taken through env and tested there.
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release
        env:
          RELEASE_KEYSTORE_FILE: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Report signing state
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            echo "Artifacts are signed with the release key from secrets."
          else
            echo "::warning::No release key on GitHub - artifacts are UNSIGNED."
            echo "Sign locally with the release keystore before distributing."
          fi

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f keystore/release.keystore

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true
