name: Release

# Only on a release tag. Nothing here runs for ordinary pushes or PRs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # A published release is immutable: its assets can never be replaced. An
      # unsigned APK would therefore burn the version number for good, so a
      # missing key stops the run here rather than at the point of no return.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Refusing to cut" \
                 "an immutable release of unsigned artifacts."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Build release
        env:
          RELEASE_KEYSTORE_FILE: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # The build falls back to an unsigned APK if the keystore did not load,
      # which is exactly the outcome the step above exists to prevent - so the
      # signature is confirmed on the artifact itself, not inferred.
      - name: Verify the artifacts are signed
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $apk"
          "$apksigner" verify --print-certs "$apk"

      - name: Remove the keystore
        if: ${{ always() }}
        run: rm -f keystore/release.keystore

      # Assets are attached to a *draft*. A release becomes immutable when it
      # is published, and assets cannot be added afterwards, so the upload has
      # to finish first.
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true

      # Publishing seals it, and is what triggers the documentation workflow.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
