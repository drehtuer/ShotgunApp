name: PR

# Builds the app, then runs the static checks and unit tests against it.
on:
  # Every pull request, whatever its base. Stacked PRs are based on the branch
  # below them rather than on main, and a base filter would leave each one in
  # the stack unverified.
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Optional: the dev signing key, held as a repository secret. Absent it,
      # the build falls back to the SDK's own debug key and still succeeds.
      - name: Restore dev keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No dev key configured - using the default debug key."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore

      - name: Assemble debug
        env:
          DEBUG_KEYSTORE_FILE: keystore/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f keystore/debug.keystore

      # The unit test and lint jobs need the same compiled output, so it is
      # carried across rather than built three times.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Runs the tests and the JaCoCo report in one go: the coverage task
      # depends on the test task, so asking for both does not run them twice.
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --stacktrace

      # Uploaded on failure too - the HTML report is how you find out which
      # assertion went red without re-running locally.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore

      # Codecov hosts the README badge and comments diff coverage on PRs.
      # Whether the token exists is decided in a run step rather than in the
      # upload step's own `if`: a step's own `env:` is not in scope for its own
      # condition, so the check has to happen before it - the same shape as the
      # optional keystore above.
      - name: Is Codecov configured?
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CODECOV_TOKEN - skipping the upload."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # A fork's pull request cannot read secrets, so this is skipped there
      # rather than failing a run the contributor cannot fix.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.codecov.outputs.configured == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/coverage/test/debug/report.xml
          flags: unittests
          fail_ci_if_error: false

  # The instrumented tests exercise the screens, the navigation and Room -
  # everything a JVM test cannot reach. They existed long before this job and
  # were never run in CI, so nothing counted them and coverage read far lower
  # than the truth.
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner has KVM but not the permissions for it, and without write
      # access the emulator refuses to start an x86_64 image at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 37 uses Android's minor-version scheme, so the image is
      # `android-37.0` - the same one the devcontainer AVD uses, and the same
      # API level as the target phone. The `-P` flag is what turns on APK
      # instrumentation; it is off everywhere else so that a build going onto a
      # phone is never slowed, because this app is judged on how timing feels.
      - name: Run instrumented tests with coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_9a
          ram-size: 4096M
          disable-animations: true
          script: >-
            ./gradlew createDebugAndroidTestCoverageReport
            -PandroidTestCoverage=true --stacktrace

      - name: Upload instrumented report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-report
          path: |
            app/build/reports/androidTests/
            app/build/reports/coverage/androidTest/
          if-no-files-found: ignore

      # The exact output path is an AGP convention rather than something this
      # repository sets, so it is found rather than assumed - and printed, so a
      # future AGP that moves it says so in the log instead of silently
      # uploading nothing.
      - name: Locate the coverage report
        id: report
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found="$(find app/build/reports/coverage/androidTest -name report.xml | head -1 || true)"
          if [ -z "$found" ]; then
            echo "No androidTest coverage report found under app/build/reports/coverage/androidTest"
            find app/build/reports -name 'report.xml' || true
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "Found $found"
            echo "path=$found" >> "$GITHUB_OUTPUT"
          fi

      - name: Is Codecov configured?
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CODECOV_TOKEN - skipping the upload."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # A separate flag, so the two halves stay legible: the logic is covered
      # on the JVM, the screens on a device.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.codecov.outputs.configured == 'true' && steps.report.outputs.path != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.path }}
          flags: instrumented
          fail_ci_if_error: false

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
